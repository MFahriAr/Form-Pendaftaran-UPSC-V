<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14532D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F5B301"/>
    </linearGradient>
  </defs>

  <!-- Latar Ornamen Lingkaran Segi Delapan Pencak Silat -->
  <circle cx="200" cy="200" r="160" fill="url(#ringGlow)" stroke="#22C55E" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#F5B301" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="200,60 299,101 340,200 299,299 200,340 101,299 60,200 101,101" 
           fill="none" stroke="#22C55E" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Siluet Pesilat Sikap Pasang Utama -->
  <g fill="url(#goldAccent)">
    <!-- Kepala & Udeng/Ikat Kepala -->
    <circle cx="200" cy="120" r="22"/>
    <path d="M185 106 Q200 95 220 108 L228 116 L218 118 Z" fill="#FDE047"/>

    <!-- Badan & Seragam Hitam/Emas -->
    <path d="M186 148 L214 148 L224 215 L176 215 Z"/>
    
    <!-- Sabuk Silat Juara -->
    <rect x="174" y="210" width="52" height="12" rx="3" fill="#22C55E"/>
    <path d="M195 222 L192 265 L202 263 L205 222 Z" fill="#22C55E"/>

    <!-- Tangan Kanan Pasang Atas -->
    <path d="M214 152 L260 128 L278 142 L266 156 L224 170 Z"/>
    <circle cx="280" cy="140" r="10"/>

    <!-- Tangan Kiri Pasang Bawah / Buka -->
    <path d="M186 152 L142 165 L124 150 L132 136 L176 168 Z"/>
    <circle cx="122" cy="148" r="10"/>

    <!-- Kuda-Kuda Depan/Tengah yang Kokoh -->
    <path d="M180 220 L130 280 L145 295 L196 235 Z"/>
    <path d="M128 280 L95 320 L130 330 L152 295 Z"/>

    <path d="M220 220 L270 280 L255 295 L204 235 Z"/>
    <path d="M272 280 L305 320 L270 330 L248 295 Z"/>
  </g>

  <!-- Garis Pijakan Matras -->
  <line x1="80" y1="335" x2="320" y2="335" stroke="#F5B301" stroke-width="3" stroke-linecap="round"/>
</svg>
