<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Perisai Emas Silat -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>

  <!-- Bentuk Perisai -->
  <path d="M50 6 L86 18 V50 C86 72 70 88 50 94 C30 88 14 72 14 50 V18 Z" 
        fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Lingkaran Persaudaraan Dalam -->
  <circle cx="50" cy="48" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Siluet Pesilat Pasang Kuda-Kuda -->
  <g fill="url(#goldGrad)">
    <!-- Kepala -->
    <circle cx="50" cy="34" r="5"/>
    <!-- Tubuh -->
    <path d="M47 41 L53 41 L55 54 L45 54 Z"/>
    <!-- Tangan Kiri Pasang -->
    <path d="M47 43 L36 38 L32 44 L36 46 L45 46 Z"/>
    <!-- Tangan Kanan Tangkis -->
    <path d="M53 43 L64 36 L68 40 L62 45 L55 46 Z"/>
    <!-- Kaki Pasang Kuda-kuda Tengah -->
    <path d="M46 54 L35 68 L40 70 L49 58 Z"/>
    <path d="M54 54 L65 68 L60 70 L51 58 Z"/>
  </g>
</svg>
